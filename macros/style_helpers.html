{% set breakpointLarge = '992px' %}

{% macro render_toggle(trigger, label) %}
<input class="e-toggle e-toggle-light" id="{{ trigger }}" type="checkbox"/>
<label class="e-toggle-btn" for="{{ trigger }}"><span class="show-for-sr">{{ label | default('Toggle', true) }}</span></label>
{{ require_css(get_asset_url('../css/Modules/modules.toggle-button.css')) }}
{% endmacro %}
